# AI-layer guardian: when the production build fails on a pull request, Claude
# reads the error log, proposes patches, and posts them as a PR comment for a
# human to review.
#
# Copy this to .github/workflows/guardian-ai.yml and add the repo secret
# ANTHROPIC_API_KEY before enabling it. It pairs with ci-production-build.yml:
# the `workflows:` list below must match the `name:` of the workflow that holds
# the `production-build` job ("Tests" in that template).
#
# It is cheap: `claude --print` only runs when the build actually failed, and
# `--max-budget-usd` caps each run. Roughly $0.05 to $0.20 per failing build in
# practice. It never commits anything: the patches are a comment, not a push.
#
# Fork PRs are skipped on purpose. A workflow_run job has access to your repo
# secrets, and this job checks out the PR head and runs `npm ci` and the build,
# which runs code from the PR. For a fork that code is untrusted, so it must
# not run next to your secrets.

name: Guardian AI

on:
  workflow_run:
    workflows: ["Tests"]   # name of the workflow containing `production-build`
    types: [completed]

jobs:
  guardian-diagnose:
    name: Guardian, diagnose build failure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run when the upstream workflow failed, the run was for a pull
    # request (not a push to main), and the PR comes from this same repository.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Reproduce the build failure to capture the error log
        id: capture
        # Add the same build-time env as your production-build job, if it needs any.
        # env:
        #   NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          # Capture the exit code and output even on failure; the tail goes into the prompt.
          set +e
          npm run build > build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_OUTPUT"
          tail -c 24000 build.log > build.tail.log
          set -e

      - name: Ask Claude to diagnose and propose patches
        if: steps.capture.outputs.BUILD_EXIT != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT=$(cat <<'EOF'
          You are reviewing a Node production build failure on a PR. The last
          24KB of `npm run build` output is in build.tail.log. Read it,
          identify the failing file(s) and line numbers, and propose minimal
          patches.

          Output STRICTLY this markdown structure:

          ## Build Failure Diagnosis

          ### Root cause
          1 to 3 sentences, citing specific error codes (for example TS2589).

          ### Failing locations
          Bulleted list: `path/to/file.ts:LINE` followed by a short description.

          ### Proposed patches
          Per file, use unified diff format inside a ```diff fenced block.
          Keep patches minimal: fix only what the error demands, with no
          speculative refactors.

          ### How to verify
          The exact command(s) that, if green, mean the fix worked.
          For example `npm run build` or `npx tsc --noEmit`.

          Do not include narration outside these sections. The output is
          pasted verbatim into a PR comment.
          EOF
          )
          # `sonnet` is an alias for the current Sonnet model; pin a full model id if you prefer.
          claude --print --model sonnet --max-budget-usd 0.50 \
            "$PROMPT"$'\n\n--- build.tail.log ---\n'"$(cat build.tail.log)" \
            > guardian-comment.md

      - name: Post diagnosis as a PR comment
        if: steps.capture.outputs.BUILD_EXIT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          {
            echo "## Guardian AI build diagnosis"
            echo ""
            echo "_The build failed on this PR. Claude analysed the error log; review the proposed patches below before applying them._"
            echo ""
            cat guardian-comment.md
            echo ""
            echo "---"
            echo "<sub>Generated by the guardian-ai workflow (\`guardian-ai.yml\`). Cost-capped at \$0.50 per failing build.</sub>"
          } > final-comment.md
          gh pr comment "$PR_NUMBER" --body-file final-comment.md
